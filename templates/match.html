{% extends 'base.html' %}{% block content %}<p class="text-cyan-400">PRACTICE MATCH</p><h1 class="text-4xl font-bold">Find your next rival.</h1><form method="post" class="card mt-8 max-w-2xl space-y-5"><label>Opponent<select name="opponent_id" required>{% for opponent in opponents %}<option value="{{ opponent.id }}">{{ opponent.name }} · {{ opponent.elo }} ELO</option>{% else %}<option disabled>No opponents yet — create a second demo account.</option>{% endfor %}</select></label><div class="grid sm:grid-cols-3 gap-4"><label>Topic<select name="topic"><option>Arrays & Hashing</option><option>Dynamic Programming</option><option>Graphs</option><option>Strings</option></select></label><label>Difficulty<select name="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></label><label>Minutes<select name="duration"><option>20</option><option selected>30</option><option>45</option></select></label></div><button class="primary" {% if not opponents %}disabled{% endif %}>Start match</button></form>{% endblock %}
