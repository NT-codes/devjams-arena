<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><title>DevJams Arena</title></head><body><div class="orb orb-one"></div><div class="orb orb-two"></div><nav class="nav-shell"><a class="brand" href="{{ url_for('profile') }}"><i></i>DEVJAMS <span>ARENA</span></a>{% if session.user_id %}<div class="nav-links"><a href="{{ url_for('profile') }}">Dashboard</a><a href="{{ url_for('match') }}">Arena</a><a class="logout" href="{{ url_for('logout') }}">Log out ↗</a></div>{% endif %}</nav><main class="page-shell">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
